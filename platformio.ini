    lewisxhe/XPowersLib @ ^0.3.2
    jgromes/RadioLib @ ^7.7.1
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.0.zip
    earlephilhower/ESP8266Audio@1.9.9
    earlephilhower/ESP8266SAM@1.1.0
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
    -DASTRA_CAMERA_USE_JPEG=1
    -DCONFIG_PIX_CVT_RGB888_TO_RGB888_SUPPORT=1
    -DCONFIG_DEFAULT_HAND_DETECT_MODEL=0
    -DCONFIG_FLASH_ESPDET_PICO_224_224_HAND=1
    -DCONFIG_HAND_DETECT_MODEL_IN_FLASH_RODATA=1
    -DCONFIG_HAND_DETECT_MODEL_LOCATION=0
    -DCONFIG_DEFAULT_HAND_GESTURE_CLS_MODEL=0
    -DCONFIG_FLASH_HAND_GESTURE_CLS_MOBILENETV2_0_5_S8_V1=1
    -DCONFIG_HAND_GESTURE_CLS_MODEL_IN_FLASH_RODATA=1
    -DCONFIG_HAND_GESTURE_CLS_MODEL_LOCATION=0
    -Ithird_party/Jet/src
    -std=gnu++17
    ; The bundled esp32-camera creates cam_task with a too-small stack.
    -Wl,--wrap=xTaskCreatePinnedToCore
board_build.embed_files =
