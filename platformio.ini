; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;!===============================VARIANT========================================
default_envs = T-Glass
build_cache_dir = .pio/build_cache
;! ===============================Examples=======================================
;! The src_dir variable can only have one row
src_dir = examples/AstraPort
;src_dir = examples/BatteryVoltage
;src_dir = examples/CameraWebServer
;src_dir = examples/DeepSleep
;src_dir = examples/Factory
;src_dir = examples/HelloWorld
;src_dir = examples/LoRa_868_915_PingPong
;src_dir = examples/RecordWAV
;src_dir = examples/SX126x_PingPong
;src_dir = examples/SX126x_Receive_Interrupt
; src_dir = examples/SX126x_Transmit_Interrupt
; src_dir = examples/SimplePlayback
; src_dir = examples/SimplePlaybackWithTouch
;src_dir = examples/RadioDemo
; src_dir = examples/TouchButton
;src_dir = examples/LilyGo3D
;src_dir = examples/DinoJump
;! Don't make changes
boards_dir = boards

[env]
; Shared hardware sources are selected explicitly per environment.
lib_extra_dirs =
platform = espressif32@6.13.0
framework = arduino
upload_speed =  921600
monitor_speed = 115200

build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
    ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
	-DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable -UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -UARDUINO_USB_CDC_ON_BOOT

	-DCORE_DEBUG_LEVEL=4

board_build.partitions = huge_app.csv


monitor_filters =
	default
	esp32_exception_decoder

lib_deps =
	lvgl/lvgl @ ^8.4.0
	olikraus/U8g2 @ ^2.36.18
	lewisxhe/SensorLib @ ^0.3.3
	lewisxhe/XPowersLib @ ^0.3.2
	FS
	SPIFFS
	SD
	jgromes/RadioLib @ ^7.7.1
	https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.0.zip
	earlephilhower/ESP8266Audio@1.9.9
	earlephilhower/ESP8266SAM@1.1.0

[env:T-Glass]
extends = env
; Pinned pioarduino platform source; do not use a developer-local PlatformIO cache path.
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/f89295f6a617a8ec611f4bd4eb2f998799dc5dc8.zip
board = T-Glass-V3
; The registry archive currently contains only the esptool launcher. Use the
; tagged source archive so the custom platform can install the actual package.
platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/esptool/archive/refs/tags/v5.3.0.zip
lib_extra_dirs =
extra_scripts =
    pre:examples/AstraPort/platformio_src.py
lib_deps =
    olikraus/U8g2 @ ^2.36.18
    lewisxhe/SensorLib @ ^0.3.3
    lewisxhe/XPowersLib @ ^0.3.2
    jgromes/RadioLib @ ^7.7.1
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.0.zip
    earlephilhower/ESP8266Audio@1.9.9
    earlephilhower/ESP8266SAM@1.1.0
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
    -DASTRA_CAMERA_USE_JPEG=1
    -DCONFIG_PIX_CVT_RGB888_TO_RGB888_SUPPORT=1
    -DCONFIG_DEFAULT_HAND_DETECT_MODEL=0
    -DCONFIG_FLASH_ESPDET_PICO_224_224_HAND=1
    -DCONFIG_HAND_DETECT_MODEL_IN_FLASH_RODATA=1
    -DCONFIG_HAND_DETECT_MODEL_LOCATION=0
    -DCONFIG_DEFAULT_HAND_GESTURE_CLS_MODEL=0
    -DCONFIG_FLASH_HAND_GESTURE_CLS_MOBILENETV2_0_5_S8_V1=1
    -DCONFIG_HAND_GESTURE_CLS_MODEL_IN_FLASH_RODATA=1
    -DCONFIG_HAND_GESTURE_CLS_MODEL_LOCATION=0
    -Ithird_party/Jet/src
    -std=gnu++17
    ; The bundled esp32-camera creates cam_task with a too-small stack.
    -Wl,--wrap=xTaskCreatePinnedToCore
board_build.embed_files =
    examples/AstraPort/models/hand_detect.espdl
    examples/AstraPort/models/hand_gesture_cls.espdl
board_build.filesystem = spiffs
board_build.partitions = examples/AstraPort/partitions.csv

